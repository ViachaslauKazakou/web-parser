services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forumscope}
      POSTGRES_USER: ${POSTGRES_USER:-forumscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forumscope_dev}
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:-./data/postgres}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forumscope}:${POSTGRES_PASSWORD:-forumscope_dev}@db:5432/${POSTGRES_DB:-forumscope}
    ports:
      - "127.0.0.1:${APP_PORT:-8040}:8040"
    volumes:
      - .:/app
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 536870912
          mode: 0o1777
    shm_size: 1gb
    mem_limit: 1g
    security_opt:
      - seccomp:./docker/seccomp_profile.json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8040", "--reload"]
